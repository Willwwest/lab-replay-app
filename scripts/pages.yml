name: Deploy Replay to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run worker
      - run: npm test
      # The hosted copy has no Replay service (VITE_REPLAY_API is empty):
      # timing, filming, review, analysis and side by side work on the
      # device; rosters, leaderboards, team runs and messages are off.
      - run: npx vite build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_REPLAY_API: ""
          VITE_MEMBER_APP: https://willwwest.github.io/lab-skill-unlocks-app/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
